name: guardian-sweep

# Central guardian: hourly IOC sweep across ALL repos from OUTSIDE them, so an
# attacker holding a write token on any victim repo cannot disable this by
# pushing to that repo. Read-only by design: the sweep PAT cannot modify your
# repos; findings raise an issue here (email notification to watchers).
# Setup: repo secret GUARD_PAT = fine-grained PAT, Contents: Read (all repos).

on:
  schedule:
    - cron: "23 */2 * * *"  # every 2h (private repo Actions quota)
  workflow_dispatch:

permissions:
  issues: write   # alerting only; no repo contents are ever modified

concurrency:
  group: guardian-sweep
  cancel-in-progress: false

env:
  ORGS: "The-Aetheris"     # orgs to include, space-separated

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep every branch of every repo for campaign IOCs
        env:
          PAT: ${{ secrets.GUARD_PAT }}
          ALERT_TOKEN: ${{ github.token }}
          GUARDIAN: ${{ github.repository }}
        run: |
          set -u
          if [ -z "${PAT:-}" ]; then
            echo "::error title=GUARD_PAT kosong::secret GUARD_PAT belum diisi (set ulang: gh secret set GUARD_PAT -R athallarizky/guardian)"
            exit 1
          fi
          findings=""

          scan_ref() {  # $1=repo $2=branch  (accumulates into $findings, single-line entries joined by ~)
            local repo="$1" br="$2" tree size path c v d
            tree=$(GH_TOKEN="$PAT" gh api "repos/$repo/git/trees/$br?recursive=1" --jq '.tree[] | select(.type=="blob") | "\(.size)\t\(.path)"' 2>/dev/null) || return 0
            while IFS=$'\t' read -r size path; do
              [ -z "${path:-}" ] && continue
              case "$path" in
                .vscode/tasks.json|*/.vscode/tasks.json|.vscode/settings.json|*/.vscode/settings.json) ;;
                api.js|*/api.js|.env|*/.env|config.bat|*/config.bat|.gitignore) ;;
                *.woff|*.woff2|*.ttf|*.otf|*.eot) [ "${size:-0}" -lt 10240 ] || continue ;;
                *) continue ;;
              esac
              c=$(GH_TOKEN="$PAT" gh api "repos/$repo/contents/$path?ref=$br" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || continue
              case "$path" in
                .vscode/tasks.json|*/.vscode/tasks.json)
                  echo "$c" | grep -q folderOpen && echo "$c" | grep -qE '(node|python|perl|ruby|bash|sh|powershell) ' && echo "$c" | grep -qE '\.(woff2?|ttf|otf|eot|svg)' && findings="$findings~$repo@$br :: $path (hidden folderOpen task)" ;;
                .vscode/settings.json|*/.vscode/settings.json)
                  echo "$c" | grep -q '"task.allowAutomaticTasks"[[:space:]]*:[[:space:]]*true' && findings="$findings~$repo@$br :: $path (allowAutomaticTasks)" ;;
                api.js|*/api.js)
                  echo "$c" | grep -qF '/.{1,2}/g' && echo "$c" | grep -q TextDecoder && findings="$findings~$repo@$br :: $path (obfuscated JS droplet)" ;;
                .env|*/.env)
                  while read -r v; do d=$(printf '%s' "$v" | base64 -d 2>/dev/null) || continue
                    case "$d" in http://*|https://*) findings="$findings~$repo@$br :: $path (env dropper URL: $d)"; break ;; esac
                  done < <(echo "$c" | grep -oE '"[A-Za-z0-9+/=]{16,}"' | tr -d '"') ;;
                config.bat|*/config.bat) findings="$findings~$repo@$br :: $path (stage-2 dropper)" ;;
                .gitignore) echo "$c" | grep -qxE 'config\.bat|\*\.bat' && findings="$findings~$repo@$br :: $path (campaign fingerprint: bat ignore line)" ;;
                *.woff|*.woff2|*.ttf|*.otf|*.eot)
                  echo "$c" | grep -qE '\(function|Function\(|require\(|eval\(|child_process' && findings="$findings~$repo@$br :: $path (fake font: JS inside font file)" ;;
              esac
            done <<< "$tree"
          }

          targets=$(GH_TOKEN="$PAT" gh api --paginate "user/repos?type=owner&per_page=100" --jq '.[] | select(.fork == false) | .full_name' 2>/dev/null)
          for org in $ORGS; do
            orgrepos=$(GH_TOKEN="$PAT" gh api --paginate "orgs/$org/repos?per_page=100" --jq '.[].full_name' 2>/dev/null)
            targets="$targets
          $orgrepos"
          done

          n=0
          while read -r repo; do
            [ -z "$repo" ] && continue
            while read -r br; do
              [ -z "$br" ] && continue
              scan_ref "$repo" "$br"
              n=$((n+1))
            done < <(GH_TOKEN="$PAT" gh api "repos/$repo/branches?per_page=100" --jq '.[].name' 2>/dev/null)
          done <<< "$targets"

          echo "swept $n refs at $(date -u '+%F %T') UTC"
          if [ -n "$findings" ]; then
            body=$(printf '%s' "$findings" | tr '~' '\n')
            echo "FINDINGS:"; echo "$body"
            msg="Automated guardian sweep found campaign indicators. Verify and clean with the gh-incident-response playbook (scan-ioc.sh + clean-markers.sh; lift rulesets for protected repos). Do NOT open these paths in an IDE."
            GH_TOKEN="$ALERT_TOKEN" gh issue create -R "$GUARDIAN" -t "IOC detected - sweep $(date -u '+%F %H:%M') UTC" -b "$(printf '%s\n\n%s' "$msg" "$body")" && exit 1
            echo "::error::findings detected but issue creation failed - see log above"
            exit 1
          fi
          echo "clean."
